{% if page.paginator.num_pages > 1 %}
<div class="pagination">
  {% if page.has_previous %}<a href="?{{ querystring }}&page={{ page.previous_page_number }}">Sebelumnya</a>{% endif %}
  <span class="muted">Halaman {{ page.number }} dari {{ page.paginator.num_pages }}</span>
  {% if page.has_next %}<a href="?{{ querystring }}&page={{ page.next_page_number }}">Berikutnya</a>{% endif %}
</div>
{% endif %}
